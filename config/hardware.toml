# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Camera]
    #@bool 是否通过 sn 码查找相机，false 则查找第 0 个
    use_camera_sn = false
    #@string 相机 sn 码
    camera_sn = "DA5850580"
    #@bool 使用从 MVS 导出的配置文件
    use_config_from_file = true
    #@string 配置文件在 config 文件夹中的路径
    config_file_path = "MV-CS050-60UC_DA5850580.mfs"
    #@bool 是否从 Camera.config 中设置参数，会覆盖上文中的文件配置
    use_camera_config = false

[Camera.config]
    #@float 曝光时间 (us)
    ExposureTime = 9500.0
    #@float 增益
    Gain = 15.9
    #@bool 水平翻转
    ReverseX = false
    #@bool 垂直翻转
    ReverseY = false
    #@int 图像宽度
    Width = 2448
    #@string ADC 位深
    ADCBitDepth = "Bits_8"
    #@bool 启用 Gamma 校正
    GammaEnable = false
    #@float 采集帧率
    AcquisitionFrameRate = 200.0
    #@bool 启用帧率限制
    AcquisitionFrameRateEnable = true

[Serial]
    #@string 协议类型: "uart" 或 "usb_bulk"
    protocol = "uart"
    #@bool 打印串口调试信息
    data_print_debug = false
    #@bool 不接串口时使用虚拟数据
    use_fake_serial_data = true

[Serial.uart]
    #@string 串口设备路径
    port_name = "/dev/ttydart"
    #@int 波特率
    baudrate = 115200

[Serial.usb_bulk]
    # 下面这些参数仅在 protocol = "usb_bulk" 时使用
    vendor_id = "0xa11c"
    product_id = ""
    serial_number = ""
    interface_number = 0
    bulk_in_endpoint = "0x81"
    bulk_out_endpoint = "0x01"
    timeout_ms = 10
    reconnect_interval_ms = 2000
    max_reconnect_attempts = 5

[Serial.fake_data]
    # 虚拟串口数据配置
    # 实际 dart 接收协议只包含 should_detect 和 dart_number

    #@bool 当前是否应该检测
    should_detect = true
    #@int 当前第几枚飞镖，实际串口由电控发送
    dart_number = 2

[TimeSync]
    #@int 相机-串口状态时间偏移 (微秒)
    # 正值: 图像比串口状态晚到达，匹配过去的串口状态
    # 负值: 图像比串口状态早到达，匹配未来的串口状态
    delta_t_us = 4886
